<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Evaluación de Pasajero - Aerolínea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-container { max-width: 550px; margin: auto; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; margin-bottom: 5px; }
        button {
            padding: 10px 20px; background-color: #4CAF50; color: white;
            border: none; cursor: pointer; margin-top: 15px;
        }
        button:hover { background-color: #45a049; }
        h3 { margin-top: 25px; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Evaluación de Pasajero - Aerolínea</h2>
    <form th:action="@{/airline/evaluate}" th:object="${airlineRequest}" method="post">

        <h3>Datos del Pasajero</h3>
        <label for="name">Nombre:</label>
        <input type="text" id="name" th:field="${airlineRequest.passenger.name}">

        <label for="age">Edad:</label>
        <input type="number" id="age" th:field="${airlineRequest.passenger.age}">

        <label for="membershipLevel">Membresía:</label>
        <select id="membershipLevel" th:field="${airlineRequest.passenger.membershipLevel}">
            <option value="Basic">Basic</option>
            <option value="Silver">Silver</option>
            <option value="Gold">Gold</option>
            <option value="Platinum">Platinum</option>
        </select>

        <label for="seatPreference">Preferencia de asiento:</label>
        <select id="seatPreference" th:field="${airlineRequest.passenger.seatPreference}">
            <option value="None">None</option>
            <option value="Any">Any</option>
            <option value="Window">Window</option>
            <option value="Aisle">Aisle</option>
        </select>

        <label for="travelingWithChildren">¿Viaja con niños?</label>
        <select id="travelingWithChildren" th:field="${airlineRequest.passenger.travelingWithChildren}">
            <option value="false">No</option>
            <option value="true">Sí</option>
        </select>

        <h3>Datos del Vuelo</h3>
        <label for="delayMinutes">Minutos de retraso:</label>
        <input type="number" id="delayMinutes" th:field="${airlineRequest.flight.delayMinutes}">

        <label for="durationHours">Duración del vuelo (horas):</label>
        <input type="number" step="0.5" id="durationHours" th:field="${airlineRequest.flight.durationHours}">

        <h3>Equipaje</h3>
        <label for="weightKg">Peso del equipaje (kg):</label>
        <input type="number" step="0.1" id="weightKg" th:field="${airlineRequest.luggage.weightKg}">

        <button type="submit">Evaluar Pasajero</button>
    </form>
</div>
</body>
</html>
