<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resultado de la Evaluación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .result-container { max-width: 550px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        .yes { color: green; font-weight: bold; }
        .no { color: #999; }
        a { display: inline-block; margin-top: 20px; text-decoration: none; color: #4CAF50; }
        a:hover { text-decoration: underline; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 6px 4px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
<div class="result-container">
    <h2>Resultado de la Evaluación</h2>
    <p><strong th:text="${passenger.name}"></strong> — <span th:text="${passenger.age}"></span> años, membresía <span th:text="${passenger.membershipLevel}"></span></p>

    <table>
        <tr>
            <td>Ascenso a Business</td>
            <td><span th:class="${passenger.upgradedToBusiness} ? 'yes' : 'no'" th:text="${passenger.upgradedToBusiness} ? 'Sí' : 'No'"></span></td>
        </tr>
        <tr>
            <td>Elegible para ascenso</td>
            <td><span th:class="${passenger.eligibleForUpgrade} ? 'yes' : 'no'" th:text="${passenger.eligibleForUpgrade} ? 'Sí' : 'No'"></span></td>
        </tr>
        <tr>
            <td>Check-in prioritario</td>
            <td><span th:class="${passenger.priorityCheckIn} ? 'yes' : 'no'" th:text="${passenger.priorityCheckIn} ? 'Sí' : 'No'"></span></td>
        </tr>
        <tr>
            <td>Descuento aplicado</td>
            <td th:text="${passenger.discountPercentage} + '%'"></td>
        </tr>
        <tr>
            <td>Asiento asignado</td>
            <td th:text="${passenger.assignedSeat} != '' ? ${passenger.assignedSeat} : 'Ninguno'"></td>
        </tr>
        <tr>
            <td>Compensación</td>
            <td th:text="'$' + ${passenger.compensationAmount}"></td>
        </tr>
        <tr>
            <td>Puntos de lealtad</td>
            <td th:text="${passenger.loyaltyPoints}"></td>
        </tr>
        <tr>
            <td>Acceso salón VIP</td>
            <td><span th:class="${passenger.vipLoungeAccess} ? 'yes' : 'no'" th:text="${passenger.vipLoungeAccess} ? 'Sí' : 'No'"></span></td>
        </tr>
        <tr>
            <td>Asiento preferencial familiar</td>
            <td><span th:class="${passenger.preferentialFamilySeat} ? 'yes' : 'no'" th:text="${passenger.preferentialFamilySeat} ? 'Sí' : 'No'"></span></td>
        </tr>
    </table>

    <a th:href="@{/airline/form}">Volver a evaluar</a>
</div>
</body>
</html>
